# SuperViewer2: builds libprojectM 4.x for iOS (arm64, OpenGL ES 3 through
# ANGLE on Metal, static) and attaches it to a GitHub Release, so the SuperViewer2 iOS build can
# download it with a SHA-256 check (like libmpv-darwin-build).
#
# Run: Actions -> projectM iOS -> Run workflow, pick the projectM tag and
# tick "publish" to attach the result to a release named sv-ios-<tag>.
# Manual runs only: a tag push would check out upstream code that doesn't
# contain this workflow file.
name: projectM iOS

on:
  workflow_dispatch:
    inputs:
      projectm_ref:
        description: projectM tag or commit to build
        default: v4.1.4
      publish:
        description: Publish a GitHub Release (sv-ios-<tag>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      REF: ${{ inputs.projectm_ref }}
      # ANGLE for iOS from LiamGFX/angle-ios (angle-ios.yml there). projectM
      # compiles against its GLES3/KHR headers; the app embeds its frameworks.
      ANGLE_URL: https://github.com/LiamGFX/angle-ios/releases/download/angle-ios-1f6526a566/angle-ios-arm64-1f6526a566.tar.gz
      ANGLE_SHA256: 9c17f4fa02a70740c654c49364ede0b6d0f34319c90ebf8b8f6aa0ba18fc183c
    steps:
      - uses: actions/checkout@v4
        with:
          # Upstream, not this fork: forks made with "copy the default branch
          # only" have no upstream tags.
          repository: projectM-visualizer/projectm
          ref: ${{ env.REF }}
          submodules: recursive  # projectm-eval lives in a submodule
          fetch-depth: 0

      - name: ANGLE
        run: |
          curl -fL "$ANGLE_URL" -o angle.tar.gz
          echo "$ANGLE_SHA256  angle.tar.gz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/angle" && tar -xzf angle.tar.gz -C "$RUNNER_TEMP/angle"
          echo "ANGLE=$RUNNER_TEMP/angle" >> "$GITHUB_ENV"

      - name: Allow GLES on iOS
        run: |
          # projectM 4.1 stops GLES builds on anything but Linux/Android with a
          # FATAL_ERROR; with ANGLE, iOS has a real GLES 3 + Khronos headers, so
          # turn just that message into a STATUS line (works whether the message
          # spans one line or several; build-time only, nothing else changes).
          grep -n -B1 'only available for Linux' CMakeLists.txt
          perl -0pi -e 's/FATAL_ERROR(\s+"OpenGL ES 3 support is currently only available for Linux)/STATUS$1/' CMakeLists.txt
          grep -n -B1 'only available for Linux' CMakeLists.txt | grep -q STATUS
          # projectM's GL header picks <OpenGL/gl3.h> (macOS desktop GL) for
          # every Apple target; make that branch skip GLES builds so iOS falls
          # through to its <GLES3/gl3.h> branch (ANGLE's headers).
          FILES=$(grep -rl 'OpenGL/gl3.h' src)
          echo "$FILES"
          for f in $FILES; do
            perl -pi -e 's/^#\s*ifdef\s+__APPLE__\s*$/#if defined(__APPLE__)\n/; s/^(#\s*(?:el)?if\s+)defined\s*\(\s*__APPLE__\s*\)/$1(defined(__APPLE__) \&\& !defined(USE_GLES))/' "$f"
            grep -n -B2 'OpenGL/gl3.h' "$f"
            grep -q 'defined(__APPLE__) && !defined(USE_GLES)' "$f"
          done
          # projectM's own FindOpenGL.cmake takes the Apple branch on iOS and
          # never makes an OpenGL::GLES3 target, so we provide that target
          # ourselves (header-only: projectM is static, the app links ANGLE).
          # CMAKE_PROJECT_INCLUDE runs right after project(), before the
          # GLES3 check, and the "NOT TARGET" guard there then finds ours.
          cat > "$RUNNER_TEMP/angle-gles3.cmake" <<EOF
          if(NOT TARGET OpenGL::GLES3)
            add_library(OpenGL::GLES3 INTERFACE IMPORTED)
            set_target_properties(OpenGL::GLES3 PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "$ANGLE/include")
          endif()
          EOF

      - name: Configure
        run: |
          # GLES: iOS has no desktop OpenGL. The OPENGL_* cache entries point
          # projectM's OpenGL lookup at ANGLE's headers and library: its Apple
          # branch requires OPENGL_gl_LIBRARY + OPENGL_INCLUDE_DIR, the GLES3
          # names are kept for its other branches (static lib, so the real
          # link happens in the app).
          # Static: one less framework to embed and sign in the app.
          # Makefiles, not Xcode: projectm-eval attaches its Scanner.c custom
          # command to two targets, which Xcode's new build system rejects.
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_GLES=ON \
            -DOPENGL_GLES3_INCLUDE_DIR="$ANGLE/include" \
            -DOPENGL_gles3_LIBRARY="$ANGLE/libGLESv2.xcframework/ios-arm64/libGLESv2.framework/libGLESv2" \
            -DOPENGL_INCLUDE_DIR="$ANGLE/include" \
            -DOPENGL_gl_LIBRARY="$ANGLE/libGLESv2.xcframework/ios-arm64/libGLESv2.framework/libGLESv2" \
            -DCMAKE_PROJECT_INCLUDE="$RUNNER_TEMP/angle-gles3.cmake" \
            -DENABLE_PLAYLIST=ON \
            -DBUILD_TESTING=OFF

      - name: Build and install
        run: cmake --build build --target install -j "$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          NAME=projectm-${REF}-ios-arm64-angle
          tar -czf "$NAME.tar.gz" -C install .
          shasum -a 256 "$NAME.tar.gz" | tee "$NAME.tar.gz.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.tar.gz*

      - name: Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        # --target: the release tag goes on this fork's default branch, since
        # the checked-out upstream tag isn't a branch here.
        run: gh release create "sv-ios-$REF" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --target "${{ github.event.repository.default_branch }}" --title "sv-ios-$REF" --notes "libprojectM for iOS (arm64, GLES 3 via ANGLE, static), built from $REF."
